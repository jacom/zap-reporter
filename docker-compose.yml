services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zap_reporter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: zap_report
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zap_reporter -d zap_report"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ZAP Reporter (Django) ───────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ZAP_BASE_URL: http://zap:8090
      TRIVY_SERVER_URL: http://trivy:4954
      SONARQUBE_URL: http://sonarqube:9000
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py shell -c 'from django.contrib.auth import get_user_model; U=get_user_model(); U.objects.filter(username=\"admin\").exists() or U.objects.create_superuser(\"admin\",\"admin@localhost\",\"Admin@1234!\")' &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/zap-reporter.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro

  # ── OWASP ZAP ───────────────────────────────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    user: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.key=${ZAP_API_KEY:-zap-docker-key}
      -config "api.addrs.addr(0).name=.*"
      -config "api.addrs.addr(0).enabled=true"
    volumes:
      - zap_data:/home/zap/.ZAP

  # ── Trivy Server ────────────────────────────────────────────────────────────
  trivy:
    image: aquasec/trivy:latest
    restart: unless-stopped
    command: server --listen 0.0.0.0:4954
    volumes:
      - trivy_cache:/root/.cache/trivy

  # ── SonarQube ───────────────────────────────────────────────────────────────
  # NOTE: ต้องรันคำสั่งนี้บน host ก่อน: sysctl -w vm.max_map_count=524288
  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: zap_reporter
      SONAR_JDBC_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  db_data:
  media_data:
  static_data:
  zap_data:
  trivy_cache:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
